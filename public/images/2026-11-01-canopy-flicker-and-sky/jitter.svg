<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15">
  <rect width="720" height="360" fill="#0b0b0b"/>
  <text x="360" y="30" text-anchor="middle" fill="#c8c8c8">One pixel under three frames of jitter</text>
  <text x="136" y="82" text-anchor="middle" fill="#c8c8c8">frame 1</text>
  <text x="360" y="82" text-anchor="middle" fill="#c8c8c8">frame 2</text>
  <text x="584" y="82" text-anchor="middle" fill="#c8c8c8">frame 3</text>
  <g fill="none" stroke="#8a8a84" stroke-width="1">
    <rect x="70" y="100" width="44" height="44"/><rect x="114" y="100" width="44" height="44"/><rect x="158" y="100" width="44" height="44"/>
    <rect x="70" y="144" width="44" height="44"/><rect x="158" y="144" width="44" height="44"/>
    <rect x="70" y="188" width="44" height="44"/><rect x="114" y="188" width="44" height="44"/><rect x="158" y="188" width="44" height="44"/>
    <rect x="294" y="100" width="44" height="44"/><rect x="338" y="100" width="44" height="44"/><rect x="382" y="100" width="44" height="44"/>
    <rect x="294" y="144" width="44" height="44"/><rect x="382" y="144" width="44" height="44"/>
    <rect x="294" y="188" width="44" height="44"/><rect x="338" y="188" width="44" height="44"/><rect x="382" y="188" width="44" height="44"/>
    <rect x="518" y="100" width="44" height="44"/><rect x="562" y="100" width="44" height="44"/><rect x="606" y="100" width="44" height="44"/>
    <rect x="518" y="144" width="44" height="44"/><rect x="606" y="144" width="44" height="44"/>
    <rect x="518" y="188" width="44" height="44"/><rect x="562" y="188" width="44" height="44"/><rect x="606" y="188" width="44" height="44"/>
  </g>
  <g fill="none" stroke="#c8c8c8" stroke-width="1.5">
    <rect x="114" y="144" width="44" height="44"/>
    <rect x="338" y="144" width="44" height="44"/>
    <rect x="562" y="144" width="44" height="44"/>
  </g>
  <line x1="130" y1="100" x2="130" y2="232" stroke="#d9c591" stroke-width="3"/>
  <line x1="354" y1="100" x2="354" y2="232" stroke="#d9c591" stroke-width="3"/>
  <line x1="578" y1="100" x2="578" y2="232" stroke="#d9c591" stroke-width="3"/>
  <circle cx="130" cy="166" r="5" fill="#d9c591" stroke="#0b0b0b" stroke-width="1"/>
  <circle cx="370" cy="166" r="5" fill="#0b0b0b" stroke="#c8c8c8" stroke-width="1.5"/>
  <circle cx="578" cy="170" r="5" fill="#d9c591" stroke="#0b0b0b" stroke-width="1"/>
  <text x="136" y="256" text-anchor="middle" fill="#d9c591">sample hits the leaf</text>
  <text x="360" y="256" text-anchor="middle" fill="#8a8a84">sample hits the sky</text>
  <text x="584" y="256" text-anchor="middle" fill="#d9c591">sample hits the leaf</text>
  <text x="360" y="300" text-anchor="middle" fill="#c8c8c8">The leaf has not moved, but the pixel alternates</text>
  <text x="360" y="322" text-anchor="middle" fill="#8a8a84">between leaf and sky as the sample position changes</text>
</svg>
