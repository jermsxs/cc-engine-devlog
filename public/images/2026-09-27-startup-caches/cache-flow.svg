<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15" role="img">
<title>A cache lookup: build a key from every input, load on a match, otherwise rebuild and store</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a84"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<g fill="none" stroke="#c8c8c8" stroke-width="1.5">
<rect x="20" y="60" width="170" height="100" rx="6"/>
<rect x="240" y="85" width="120" height="50" rx="6" stroke="#d9c591"/>
<rect x="410" y="85" width="130" height="50" rx="6"/>
<rect x="580" y="30" width="120" height="50" rx="6"/>
<rect x="410" y="230" width="130" height="50" rx="6"/>
<rect x="580" y="230" width="120" height="50" rx="6"/>
</g>
<g fill="#c8c8c8" text-anchor="middle" font-size="14">
<text x="105" y="85">Inputs</text>
<text x="300" y="115" fill="#d9c591">Hash to key</text>
<text x="475" y="115">Entry found?</text>
<text x="640" y="60">Load it</text>
<text x="475" y="260">Rebuild</text>
<text x="640" y="260">Write, rename</text>
</g>
<g fill="#8a8a84" text-anchor="middle" font-size="13">
<text x="105" y="108">source or image</text><text x="105" y="126">settings</text><text x="105" y="144">tool version</text>
<text x="475" y="157">header checked too</text>
<text x="640" y="304">temp file, then rename</text>
<text x="475" y="200">no, or damaged</text>
</g>
<g stroke="#8a8a84" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="190" y1="110" x2="238" y2="110"/><line x1="360" y1="110" x2="408" y2="110"/>
<path d="M540 100 L560 100 L560 55 L578 55"/>
<path d="M475 135 L475 228"/>
<line x1="540" y1="255" x2="578" y2="255"/>
</g>
<text x="552" y="50" fill="#8a8a84" font-size="13" text-anchor="end">yes</text>
<text x="360" y="340" text-anchor="middle" fill="#8a8a84" font-size="14">anything that changes the output has to be part of the key</text>
</svg>
