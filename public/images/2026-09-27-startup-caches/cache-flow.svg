<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Inter, sans-serif" font-size="15" role="img">
<title>Cache lookup: the key matches so the stored result loads quickly, or it does not match so the asset is rebuilt and stored</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8d8d89"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<g fill="none" stroke="#cfcfcb" stroke-width="1.5">
<rect x="30" y="130" width="150" height="60" rx="6"/><rect x="225" y="130" width="165" height="60" rx="6"/>
<rect x="460" y="55" width="220" height="64" rx="6" stroke="#d8b67a"/><rect x="460" y="200" width="220" height="64" rx="6"/>
</g>
<g fill="#cfcfcb" text-anchor="middle">
<text x="105" y="155">Need a shader</text><text x="105" y="177">or a texture</text>
<text x="307" y="155">Key from source,</text><text x="307" y="177">settings, tool version</text>
<text x="570" y="82" fill="#d8b67a">Key matches: load it</text><text x="570" y="228">Key is new: rebuild it</text>
</g>
<g fill="#8d8d89" text-anchor="middle" font-size="14"><text x="570" y="104">every launch after: 1.3 s</text><text x="570" y="250">first launch: 9.7 s</text>
<text x="570" y="295">then store it for next time</text></g>
<g stroke="#8d8d89" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="180" y1="160" x2="223" y2="160"/><line x1="390" y1="150" x2="458" y2="100"/><line x1="390" y1="170" x2="458" y2="222"/>
</g>
<text x="420" y="80" text-anchor="end" fill="#8d8d89" font-size="14">same key</text>
<text x="420" y="255" text-anchor="end" fill="#8d8d89" font-size="14">changed or missing</text>
</svg>
