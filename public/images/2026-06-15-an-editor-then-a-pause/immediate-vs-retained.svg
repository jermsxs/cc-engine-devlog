<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15" role="img">
<title>Retained mode keeps widget objects between frames; immediate mode describes the widgets again every frame</title>
<rect width="720" height="360" fill="#0b0b0b"/>
<line x1="360" y1="40" x2="360" y2="330" stroke="#8a8a84" stroke-width="1" stroke-dasharray="4 6"/>
<text x="195" y="50" text-anchor="middle" fill="#c8c8c8">Retained mode</text>
<text x="525" y="50" text-anchor="middle" fill="#d9c591">Immediate mode</text>
<g fill="none" stroke="#c8c8c8" stroke-width="1.5">
<rect x="40" y="80" width="310" height="60" rx="6"/>
<rect x="40" y="170" width="310" height="60" rx="6"/>
<rect x="40" y="260" width="310" height="60" rx="6"/>
</g>
<g fill="none" stroke="#d9c591" stroke-width="1.5">
<rect x="380" y="80" width="310" height="60" rx="6"/>
<rect x="380" y="170" width="310" height="60" rx="6"/>
<rect x="380" y="260" width="310" height="60" rx="6"/>
</g>
<g fill="#c8c8c8" text-anchor="middle" font-size="14">
<text x="195" y="107">create a Button object once</text><text x="195" y="127" fill="#8a8a84">the library stores it in a tree</text>
<text x="195" y="197">the library draws the tree</text><text x="195" y="217" fill="#8a8a84">every frame</text>
<text x="195" y="287">a click calls a stored callback</text><text x="195" y="307" fill="#8a8a84">state lives in the widget</text>
<text x="535" y="107">if (Button("Save")) { ... }</text><text x="535" y="127" fill="#8a8a84">called again every frame</text>
<text x="535" y="197">the call draws and tests</text><text x="535" y="217" fill="#8a8a84">the mouse in the same step</text>
<text x="535" y="287">the result is returned at once</text><text x="535" y="307" fill="#8a8a84">state lives in the application</text>
</g>
</svg>
