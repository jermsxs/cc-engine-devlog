<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Inter, sans-serif" font-size="15" role="img">
<title>Retained-mode UI keeps widget objects between frames; immediate-mode UI asks for each widget every frame</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8d8d89"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<line x1="360" y1="40" x2="360" y2="320" stroke="#8d8d89" stroke-dasharray="4 5"/>
<g text-anchor="middle"><text x="190" y="52" fill="#cfcfcb" font-size="16">Retained mode</text><text x="530" y="52" fill="#d8b67a" font-size="16">Immediate mode</text></g>
<g fill="none" stroke="#cfcfcb" stroke-width="1.5">
<rect x="60" y="90" width="260" height="50" rx="6"/><rect x="60" y="175" width="260" height="50" rx="6"/><rect x="60" y="260" width="260" height="50" rx="6"/>
</g>
<g fill="none" stroke="#d8b67a" stroke-width="1.5">
<rect x="400" y="90" width="260" height="50" rx="6"/><rect x="400" y="175" width="260" height="50" rx="6"/><rect x="400" y="260" width="260" height="50" rx="6"/>
</g>
<g fill="#cfcfcb" text-anchor="middle">
<text x="190" y="120">create a Button, keep it</text><text x="190" y="205">wait for click events</text><text x="190" y="290">edit the object to change it</text>
<text x="530" y="120">every frame: Button(&quot;Save&quot;)</text><text x="530" y="205">it draws and says if clicked</text><text x="530" y="290">if (clicked) Save();</text>
</g>
<g stroke="#8d8d89" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="190" y1="140" x2="190" y2="173"/><line x1="190" y1="225" x2="190" y2="258"/><line x1="530" y1="140" x2="530" y2="173"/><line x1="530" y1="225" x2="530" y2="258"/>
</g>
</svg>
