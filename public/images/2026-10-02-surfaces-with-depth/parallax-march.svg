<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="A view ray stepping through a height map and meeting the wall of a groove">
  <rect width="720" height="360" fill="#0b0b0b"/>
  <polygon points="60,110 330,110 340,200 410,200 420,110 660,110 660,290 60,290" fill="#1b1b19"/>
  <polyline points="60,110 330,110 340,200 410,200 420,110 660,110" fill="none" stroke="#c8c8c8" stroke-width="2"/>
  <line x1="60" y1="110" x2="660" y2="110" stroke="#8a8a84" stroke-width="1" stroke-dasharray="6 5"/>
  <line x1="254" y1="30" x2="414.1" y2="163.4" stroke="#d9c591" stroke-width="2"/>
  <line x1="414.1" y1="163.4" x2="431" y2="177.5" stroke="#d9c591" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="350" cy="110" r="3.5" fill="#0b0b0b" stroke="#d9c591" stroke-width="1.5"/>
  <circle cx="377" cy="132.5" r="3.5" fill="#0b0b0b" stroke="#d9c591" stroke-width="1.5"/>
  <circle cx="404" cy="155" r="3.5" fill="#0b0b0b" stroke="#d9c591" stroke-width="1.5"/>
  <circle cx="431" cy="177.5" r="3.5" fill="#0b0b0b" stroke="#8a8a84" stroke-width="1.5"/>
  <circle cx="414.1" cy="163.4" r="5" fill="#d9c591"/>
  <line x1="350" y1="92" x2="414.1" y2="92" stroke="#c8c8c8" stroke-width="1"/>
  <line x1="350" y1="86" x2="350" y2="98" stroke="#c8c8c8" stroke-width="1"/>
  <line x1="414.1" y1="86" x2="414.1" y2="98" stroke="#c8c8c8" stroke-width="1"/>
  <line x1="414.1" y1="110" x2="414.1" y2="158" stroke="#8a8a84" stroke-width="1" stroke-dasharray="2 3"/>
  <g font-family="Georgia, serif" font-size="14" fill="#c8c8c8">
    <text x="254" y="20" text-anchor="middle">eye</text>
    <text x="290" y="66" text-anchor="end">view ray</text>
    <text x="382" y="78" text-anchor="middle">uv shift</text>
    <text x="70" y="102" fill="#8a8a84">polygon surface</text>
    <text x="375" y="224" text-anchor="middle">groove in the height map</text>
    <text x="470" y="152" fill="#8a8a84">equal-depth steps</text>
    <text x="60" y="320" fill="#8a8a84">The ray enters at the polygon surface but meets the groove's far wall.</text>
    <text x="60" y="342" fill="#8a8a84">The texture is read at the hit, not at the entry point.</text>
  </g>
</svg>
