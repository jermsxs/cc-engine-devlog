  <text x="368" y="92" fill="#c8c8c8" font-style="italic" font-size="18">n</text>
  <text x="196" y="172" fill="#c8c8c8" font-style="italic" font-size="18" text-anchor="end">l</text>
  <text x="418" y="100" fill="#c8c8c8" font-style="italic" font-size="18">v</text>
  <text x="300" y="138" fill="#d9c591" font-style="italic" font-size="18" text-anchor="end">h</text>
  <text x="620" y="306" fill="#8a8a84" text-anchor="end" font-size="14">microscopic facets</text>
  <text x="40" y="332" fill="#c8c8c8" font-size="14">n surface normal, l direction to the light, v direction to the eye, h half vector between l and v.</text>
  <text x="40" y="352" fill="#d9c591" font-size="14">Only facets whose own normal is h (highlighted) reflect light from l toward v.</text>
