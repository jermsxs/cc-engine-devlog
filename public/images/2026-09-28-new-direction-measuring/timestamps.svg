<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15" role="img">
<title>GPU timestamps written between passes; the time of a pass is the difference of two timestamps</title>
<rect width="720" height="360" fill="#0b0b0b"/>
<text x="360" y="44" text-anchor="middle" fill="#c8c8c8">Timestamps written into the command list</text>
<g fill="none" stroke="#c8c8c8" stroke-width="1.5">
<rect x="30" y="130" width="165" height="70"/>
<rect x="195" y="130" width="165" height="70" stroke="#d9c591"/>
<rect x="360" y="130" width="165" height="70"/>
<rect x="525" y="130" width="165" height="70"/>
</g>
<g fill="#c8c8c8" text-anchor="middle">
<text x="112" y="172">Shadow</text><text x="277" y="172" fill="#d9c591">Scene</text><text x="442" y="172">Post</text><text x="607" y="172">UI</text>
</g>
<g stroke="#8a8a84" stroke-width="1.5">
<line x1="30" y1="100" x2="30" y2="215"/><line x1="195" y1="100" x2="195" y2="215"/><line x1="360" y1="100" x2="360" y2="215"/><line x1="525" y1="100" x2="525" y2="215"/><line x1="690" y1="100" x2="690" y2="215"/>
</g>
<g fill="#8a8a84" text-anchor="middle" font-size="14">
<text x="30" y="92">T0</text><text x="195" y="92">T1</text><text x="360" y="92">T2</text><text x="525" y="92">T3</text><text x="690" y="92">T4</text>
</g>
<text x="360" y="268" text-anchor="middle" fill="#c8c8c8" font-size="14">pass time in ms = (T(n+1) - T(n)) / timestamp frequency x 1000</text>
<text x="360" y="296" text-anchor="middle" fill="#8a8a84" font-size="14">the values are resolved into a buffer and read on the CPU a few frames later</text>
</svg>
