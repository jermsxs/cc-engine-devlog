<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Top-down view of a camera frustum cut into tiles and depth slices that grow thicker with distance, with a light whose range overlaps three cells">
