<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15">
  <rect width="720" height="360" fill="#0b0b0b"/>
  <g transform="translate(0,-14)">
  <line x1="40" y1="300" x2="680" y2="300" stroke="#c8c8c8" stroke-width="2"/>
  <line x1="365" y1="300" x2="592" y2="300" stroke="#d9c591" stroke-width="6"/>
  <line x1="80" y1="80" x2="200" y2="300" stroke="#8a8a84" stroke-width="1"/>
  <line x1="80" y1="80" x2="650" y2="300" stroke="#8a8a84" stroke-width="1"/>
  <line x1="80" y1="80" x2="365" y2="300" stroke="#8a8a84" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="80" y1="80" x2="592" y2="300" stroke="#8a8a84" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="80" y1="80" x2="298" y2="200" stroke="#d9c591" stroke-width="2"/>
  <line x1="298" y1="200" x2="480" y2="300" stroke="#d9c591" stroke-width="1.5" stroke-dasharray="3 5"/>
  <rect x="300" y="200" width="60" height="50" fill="#0b0b0b" stroke="#c8c8c8" stroke-width="2"/>
  <circle cx="80" cy="80" r="9" fill="#d9c591"/>
  <circle cx="480" cy="300" r="5" fill="#d9c591"/>
  <circle cx="298" cy="200" r="4" fill="#d9c591"/>
  <text x="80" y="58" fill="#c8c8c8" text-anchor="middle">light</text>
  <text x="330" y="272" fill="#c8c8c8" text-anchor="middle" font-size="14">occluder</text>
  <text x="200" y="326" fill="#c8c8c8" text-anchor="middle">lit</text>
  <text x="650" y="326" fill="#c8c8c8" text-anchor="middle">lit</text>
  <text x="478" y="326" fill="#d9c591" text-anchor="middle">in shadow</text>
  <text x="312" y="156" fill="#d9c591" font-size="14">the map stores the depth</text>
  <text x="312" y="174" fill="#d9c591" font-size="14">of the first surface hit</text>
  </g>
  <text x="40" y="338" fill="#8a8a84" font-size="14">The map keeps the depth of the nearest surface along each ray from the light.</text>
  <text x="40" y="356" fill="#d9c591" font-size="14">The marked floor point is farther from the light than the depth stored for its ray, so it is in shadow.</text>
</svg>
