<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="A light of finite width, a blocker and a receiver, showing the penumbra by similar triangles">
  <rect width="720" height="360" fill="#0b0b0b"/>
  <line x1="90" y1="130" x2="620" y2="306.7" stroke="#8a8a84" stroke-width="1" stroke-dasharray="6 5"/>
  <line x1="90" y1="190" x2="620" y2="215.2" stroke="#8a8a84" stroke-width="1" stroke-dasharray="6 5"/>
  <line x1="90" y1="130" x2="90" y2="190" stroke="#d9c591" stroke-width="6"/>
  <rect x="292" y="200" width="16" height="100" fill="#1b1b19" stroke="#c8c8c8" stroke-width="1.5"/>
  <line x1="620" y1="100" x2="620" y2="340" stroke="#c8c8c8" stroke-width="2"/>
  <line x1="636" y1="215.2" x2="636" y2="306.7" stroke="#d9c591" stroke-width="2"/>
  <line x1="630" y1="215.2" x2="642" y2="215.2" stroke="#d9c591" stroke-width="2"/>
  <line x1="630" y1="306.7" x2="642" y2="306.7" stroke="#d9c591" stroke-width="2"/>
  <line x1="90" y1="50" x2="300" y2="50" stroke="#8a8a84" stroke-width="1"/>
  <line x1="90" y1="44" x2="90" y2="56" stroke="#8a8a84" stroke-width="1"/>
  <line x1="300" y1="44" x2="300" y2="56" stroke="#8a8a84" stroke-width="1"/>
  <line x1="90" y1="80" x2="620" y2="80" stroke="#8a8a84" stroke-width="1"/>
  <line x1="90" y1="74" x2="90" y2="86" stroke="#8a8a84" stroke-width="1"/>
  <line x1="620" y1="74" x2="620" y2="86" stroke="#8a8a84" stroke-width="1"/>
  <line x1="90" y1="56" x2="90" y2="128" stroke="#8a8a84" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="300" y1="56" x2="300" y2="198" stroke="#8a8a84" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="620" y1="86" x2="620" y2="100" stroke="#8a8a84" stroke-width="1" stroke-dasharray="2 3"/>
  <g font-family="Georgia, serif" font-size="14" fill="#c8c8c8">
    <text x="195" y="40" text-anchor="middle">distance to blocker</text>
    <text x="480" y="70" text-anchor="middle">distance to receiver</text>
    <text x="90" y="218" text-anchor="middle">light, width s</text>
    <text x="300" y="322" text-anchor="middle">blocker</text>
    <text x="608" y="124" text-anchor="end">receiver</text>
    <text x="608" y="180" text-anchor="end" fill="#8a8a84">lit</text>
    <text x="608" y="326" text-anchor="end" fill="#8a8a84">umbra</text>
    <text x="648" y="265" fill="#d9c591">penumbra</text>
    <text x="360" y="352" text-anchor="middle" fill="#8a8a84">penumbra width = s × (receiver distance − blocker distance) / blocker distance</text>
  </g>
</svg>
