<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15" role="img">
<title>The game loop: read input, update the world, render, present, repeat</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a84"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<text x="360" y="50" text-anchor="middle" fill="#c8c8c8">One trip around the loop is one frame</text>
<g fill="none" stroke="#c8c8c8" stroke-width="1.5">
<rect x="30" y="110" width="140" height="80" rx="6"/>
<rect x="200" y="110" width="140" height="80" rx="6"/>
<rect x="370" y="110" width="140" height="80" rx="6" stroke="#d9c591"/>
<rect x="540" y="110" width="150" height="80" rx="6"/>
</g>
<g fill="#c8c8c8" text-anchor="middle">
<text x="100" y="145">Read input</text><text x="270" y="145">Update</text><text x="440" y="145" fill="#d9c591">Render</text><text x="615" y="145">Present</text>
</g>
<g fill="#8a8a84" text-anchor="middle" font-size="14">
<text x="100" y="168">keys, mouse</text><text x="270" y="168">move by dt, collide</text><text x="440" y="168">GPU commands</text><text x="615" y="168">swap back buffer</text>
</g>
<g stroke="#8a8a84" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="170" y1="150" x2="198" y2="150"/><line x1="340" y1="150" x2="368" y2="150"/><line x1="510" y1="150" x2="538" y2="150"/>
</g>
<path d="M615 190 L615 250 L100 250 L100 192" fill="none" stroke="#8a8a84" stroke-width="1.5" marker-end="url(#a)"/>
<text x="360" y="280" text-anchor="middle" fill="#8a8a84" font-size="14">dt = time since the previous frame, capped at 0.05 s</text>
<text x="360" y="305" text-anchor="middle" fill="#8a8a84" font-size="14">at 60 frames per second the whole loop has 16.7 ms</text>
</svg>
