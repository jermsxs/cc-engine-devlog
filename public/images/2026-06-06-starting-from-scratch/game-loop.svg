<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Inter, sans-serif" font-size="15" role="img">
<title>The game loop: read input, update the world, draw the frame, present it, repeat</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8d8d89"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<text x="360" y="60" text-anchor="middle" fill="#cfcfcb" font-size="16">One trip around the loop is one frame</text>
<g fill="none" stroke="#cfcfcb" stroke-width="1.5">
<rect x="40" y="120" width="130" height="64" rx="6"/>
<rect x="210" y="120" width="130" height="64" rx="6"/>
<rect x="380" y="120" width="130" height="64" rx="6" stroke="#d8b67a"/>
<rect x="550" y="120" width="130" height="64" rx="6"/>
</g>
<g fill="#cfcfcb" text-anchor="middle">
<text x="105" y="148">Read input</text><text x="275" y="148">Update world</text><text x="445" y="148" fill="#d8b67a">Draw frame</text><text x="615" y="148">Present</text>
</g>
<g fill="#8d8d89" text-anchor="middle" font-size="14">
<text x="105" y="170">keys, mouse</text><text x="275" y="170">move, collide</text><text x="445" y="170">lights, meshes</text><text x="615" y="170">show on screen</text>
</g>
<g stroke="#8d8d89" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="170" y1="152" x2="208" y2="152"/><line x1="340" y1="152" x2="378" y2="152"/><line x1="510" y1="152" x2="548" y2="152"/>
</g>
<path d="M615 184 L615 250 L105 250 L105 186" fill="none" stroke="#8d8d89" stroke-width="1.5" marker-end="url(#a)"/>
<text x="360" y="280" text-anchor="middle" fill="#8d8d89">repeat, 60 or more times a second</text>
</svg>
