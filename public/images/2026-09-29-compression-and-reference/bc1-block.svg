<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15">
  <rect width="720" height="360" fill="#0b0b0b"/>
  <text x="148" y="52" fill="#c8c8c8" text-anchor="middle" font-size="15">one 4 x 4 block</text>
