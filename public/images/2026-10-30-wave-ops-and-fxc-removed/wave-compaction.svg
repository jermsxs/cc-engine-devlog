  <text x="298" y="78" font-size="14" fill="#8a8a84" text-anchor="middle">2</text>
  <rect x="270" y="95" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="298" y="121" font-size="15" fill="#d9c591" text-anchor="middle">1</text>
  <rect x="270" y="150" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="298" y="176" font-size="15" fill="#d9c591" text-anchor="middle">B+1</text>
  <text x="358" y="78" font-size="14" fill="#8a8a84" text-anchor="middle">3</text>
  <rect x="330" y="95" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="358" y="121" font-size="15" fill="#d9c591" text-anchor="middle">1</text>
  <rect x="330" y="150" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="358" y="176" font-size="15" fill="#d9c591" text-anchor="middle">B+2</text>
  <text x="418" y="78" font-size="14" fill="#8a8a84" text-anchor="middle">4</text>
