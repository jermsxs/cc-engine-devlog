  <g font-size="15" fill="#c8c8c8">
    <text x="150" y="235">WaveActiveCountBits(visible) = 4</text>
    <text x="150" y="262">One lane adds 4 to the shared counter once and gets the base slot B back.</text>
    <text x="150" y="289">Each visible lane writes at B plus the number of visible lanes before it.</text>
  </g>
