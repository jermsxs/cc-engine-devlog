  <rect x="150" y="95" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="178" y="121" font-size="15" fill="#d9c591" text-anchor="middle">1</text>
  <rect x="150" y="150" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="178" y="176" font-size="15" fill="#d9c591" text-anchor="middle">B+0</text>
  <text x="238" y="78" font-size="14" fill="#8a8a84" text-anchor="middle">1</text>
  <rect x="210" y="95" width="56" height="40" fill="none" stroke="#8a8a84" stroke-width="1.5"/>
  <text x="238" y="121" font-size="15" fill="#8a8a84" text-anchor="middle">0</text>
  <rect x="210" y="150" width="56" height="40" fill="none" stroke="#8a8a84" stroke-width="1.5"/>
