  <rect x="390" y="150" width="56" height="40" fill="none" stroke="#8a8a84" stroke-width="1.5"/>
  <text x="418" y="176" font-size="15" fill="#8a8a84" text-anchor="middle">-</text>
  <text x="478" y="78" font-size="14" fill="#8a8a84" text-anchor="middle">5</text>
  <rect x="450" y="95" width="56" height="40" fill="none" stroke="#8a8a84" stroke-width="1.5"/>
