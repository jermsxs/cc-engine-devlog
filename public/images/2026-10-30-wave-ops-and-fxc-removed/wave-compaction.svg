  <text x="478" y="176" font-size="15" fill="#8a8a84" text-anchor="middle">-</text>
  <text x="538" y="78" font-size="14" fill="#8a8a84" text-anchor="middle">6</text>
  <rect x="510" y="95" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="538" y="121" font-size="15" fill="#d9c591" text-anchor="middle">1</text>
  <rect x="510" y="150" width="56" height="40" fill="none" stroke="#d9c591" stroke-width="1.5"/>
  <text x="538" y="176" font-size="15" fill="#d9c591" text-anchor="middle">B+3</text>
  <text x="598" y="78" font-size="14" fill="#8a8a84" text-anchor="middle">7</text>
  <rect x="570" y="95" width="56" height="40" fill="none" stroke="#8a8a84" stroke-width="1.5"/>
