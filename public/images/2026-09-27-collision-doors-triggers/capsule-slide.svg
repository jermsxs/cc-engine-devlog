<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Inter, sans-serif" font-size="15" role="img">
<title>Top view of a capsule player pushing diagonally into a wall and sliding along it</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d8b67a"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<text x="360" y="36" text-anchor="middle" fill="#cfcfcb" font-size="16">Top view: pushing diagonally into a wall</text>
<line x1="520" y1="60" x2="520" y2="320" stroke="#cfcfcb" stroke-width="6"/>
<text x="540" y="310" fill="#8d8d89" font-size="14">wall</text>
<line x1="160" y1="260" x2="600" y2="140" stroke="#8d8d89" stroke-width="1.5" stroke-dasharray="6 6"/>
<circle cx="160" cy="260" r="30" fill="none" stroke="#8d8d89" stroke-width="1.5"/>
<circle cx="490" cy="170" r="30" fill="none" stroke="#8d8d89" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="490" cy="140" r="30" fill="none" stroke="#d8b67a" stroke-width="2.5"/>
<line x1="490" y1="170" x2="490" y2="150" stroke="#d8b67a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="160" y="316" text-anchor="middle" fill="#8d8d89" font-size="14">start</text>
<text x="300" y="196" fill="#8d8d89" font-size="14" transform="rotate(-15 300 196)">where I pushed</text>
<text x="450" y="118" text-anchor="end" fill="#d8b67a" font-size="14">slides along the wall</text>
<text x="450" y="232" text-anchor="end" fill="#8d8d89" font-size="14">touches the wall here</text>
</svg>
