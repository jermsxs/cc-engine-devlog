<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15" role="img">
<title>Top view of a capsule pushing diagonally into a wall: the part of the move into the wall is removed and the part along it is kept</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a84"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9c591"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<line x1="480" y1="50" x2="480" y2="320" stroke="#c8c8c8" stroke-width="5"/>
<text x="492" y="72" fill="#c8c8c8" font-size="14">wall</text>
<circle cx="452" cy="250" r="28" fill="none" stroke="#c8c8c8" stroke-width="1.5"/>
<circle cx="452" cy="170" r="28" fill="none" stroke="#8a8a84" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="452" y1="250" x2="552" y2="170" stroke="#8a8a84" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<line x1="452" y1="250" x2="550" y2="250" stroke="#8a8a84" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#a)"/>
<line x1="452" y1="250" x2="452" y2="200" stroke="#d9c591" stroke-width="2"/>
<g font-size="14">
<text x="565" y="168" fill="#8a8a84">intended move</text>
<text x="565" y="254" fill="#8a8a84">into the wall: removed</text>
<text x="408" y="212" fill="#d9c591" text-anchor="end">along the wall: kept</text>
<text x="360" y="256" fill="#c8c8c8" text-anchor="end">player capsule</text>
<text x="408" y="150" fill="#8a8a84" text-anchor="end">position after the slide</text>
</g>
<text x="360" y="344" text-anchor="middle" fill="#8a8a84" font-size="14">slide move = intended move minus its component along the wall normal</text>
</svg>
