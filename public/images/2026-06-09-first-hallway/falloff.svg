<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Inter, sans-serif" font-size="15" role="img">
<title>Brightness against distance from a lamp: pure inverse square versus a version that reaches zero at the lamp radius</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8d8d89"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<g stroke="#8d8d89" stroke-width="1.5" fill="none"><line x1="80" y1="300" x2="690" y2="300"/><line x1="80" y1="60" x2="80" y2="300"/></g>
<line x1="580" y1="70" x2="580" y2="300" stroke="#8d8d89" stroke-dasharray="4 5"/>
<text x="580" y="58" text-anchor="middle" fill="#8d8d89" font-size="14">lamp radius</text>
<text x="80" y="42" text-anchor="middle" fill="#8d8d89" font-size="14">brightness</text>
<g fill="#8d8d89" font-size="14" text-anchor="middle"><text x="80" y="322">0 m</text><text x="280" y="322">2 m</text><text x="480" y="322">4 m</text><text x="680" y="322">6 m</text></g>
<polyline fill="none" stroke="#8d8d89" stroke-width="2" points="80,60 105,74 130,108 155,146 180,180 230,226 280,252 380,276 480,286 580,291 680,293"/>
<polyline fill="none" stroke="#d8b67a" stroke-width="2.5" points="80,60 105,85 130,127 155,169 180,204 230,248 280,271 380,290 480,297 580,300"/>
<text x="330" y="190" fill="#d8b67a">windowed: hits zero at the radius</text>
<text x="330" y="225" fill="#8d8d89">pure 1/d&#178;: never reaches zero</text>
<text x="360" y="350" text-anchor="middle" fill="#8d8d89" font-size="14">distance from the lamp (schematic)</text>
</svg>
