<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, serif" font-size="15" role="img">
<title>The three passes of one frame and the image each one writes</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a84"/></marker></defs>
<rect width="720" height="360" fill="#0b0b0b"/>
<text x="360" y="46" text-anchor="middle" fill="#c8c8c8">The passes of one frame</text>
<g fill="none" stroke="#c8c8c8" stroke-width="1.5">
<rect x="30" y="100" width="150" height="80" rx="6"/>
<rect x="225" y="100" width="150" height="80" rx="6" stroke="#d9c591"/>
<rect x="420" y="100" width="150" height="80" rx="6"/>
<rect x="615" y="100" width="75" height="80" rx="6"/>
</g>
<g fill="#c8c8c8" text-anchor="middle">
<text x="105" y="135">Shadow</text><text x="300" y="135" fill="#d9c591">Scene</text><text x="495" y="135">Post</text><text x="652" y="135">Screen</text>
</g>
<g fill="#8a8a84" text-anchor="middle" font-size="14">
<text x="105" y="158">depth from the lamp</text><text x="300" y="158">lit colour, HDR</text><text x="495" y="158">bloom, tone map</text>
</g>
<g stroke="#8a8a84" stroke-width="1.5" fill="none" marker-end="url(#a)">
<line x1="180" y1="140" x2="223" y2="140"/><line x1="375" y1="140" x2="418" y2="140"/><line x1="570" y1="140" x2="613" y2="140"/>
</g>
<g fill="#8a8a84" text-anchor="middle" font-size="14">
<text x="105" y="215">2048 x 2048 depth map</text>
<text x="300" y="215">R16G16B16A16_FLOAT</text>
<text x="300" y="237">up to 16 lights per pixel</text>
<text x="495" y="215">one full-screen triangle</text>
<text x="652" y="215">8 bits</text>
</g>
<text x="360" y="300" text-anchor="middle" fill="#8a8a84" font-size="14">values above 1.0 exist only inside the scene target; the post pass compresses them to 0 to 1</text>
</svg>
