    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9c591"/></marker>
  </defs>
  <rect x="520" y="110" width="140" height="170" fill="#161616" stroke="#c8c8c8" stroke-width="2"/>
  <line x1="60" y1="280" x2="520" y2="280" stroke="#c8c8c8" stroke-width="2"/>
  <path d="M360,280 L240,280 A120,120 0 0 1 447.6,197.9 Z" fill="#d9c591" fill-opacity="0.18" stroke="none"/>
