  <line x1="360" y1="280" x2="120" y2="280" stroke="#d9c591" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="360" y1="280" x2="360" y2="150" stroke="#c8c8c8" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="360" cy="280" r="5" fill="#d9c591"/>
  <text x="368" y="152" fill="#c8c8c8" font-style="italic" font-size="18">n</text>
  <text x="330" y="236" fill="#d9c591" text-anchor="middle" font-size="14">open</text>
  <text x="470" y="262" fill="#8a8a84" text-anchor="middle" font-size="14">blocked</text>
  <text x="150" y="268" fill="#d9c591" text-anchor="middle" font-style="italic" font-size="16">h1</text>
  <text x="476" y="158" fill="#d9c591" font-style="italic" font-size="16" text-anchor="end">h2</text>
  <text x="360" y="304" fill="#c8c8c8" text-anchor="middle" font-size="14">surface point</text>
  <text x="590" y="200" fill="#8a8a84" text-anchor="middle" font-size="14">wall</text>
  <text x="40" y="332" fill="#c8c8c8" font-size="14">One slice through the depth buffer. Each horizon is the highest surface seen from the point on that side.</text>
  <text x="40" y="352" fill="#d9c591" font-size="14">The ambient light that reaches the point arrives through the open sector between h1 and h2.</text>
