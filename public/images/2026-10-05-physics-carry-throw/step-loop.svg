<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="One physics step: find contacts, prepare them, eight substeps of six stages each, then restitution and sleep">
  <rect width="720" height="360" fill="#0b0b0b"/>
  <g fill="#1b1b19" stroke="#c8c8c8" stroke-width="1.5">
    <rect x="20" y="24" width="330" height="48"/>
    <rect x="370" y="24" width="330" height="48"/>
    <rect x="20" y="250" width="330" height="48"/>
    <rect x="370" y="250" width="330" height="48"/>
  </g>
  <rect x="20" y="100" width="680" height="120" rx="8" fill="none" stroke="#d9c591" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g fill="#1b1b19" stroke="#8a8a84" stroke-width="1.5">
    <rect x="30" y="126" width="98" height="78"/>
    <rect x="142.4" y="126" width="98" height="78"/>
    <rect x="254.8" y="126" width="98" height="78"/>
    <rect x="367.2" y="126" width="98" height="78"/>
    <rect x="479.6" y="126" width="98" height="78"/>
    <rect x="592" y="126" width="98" height="78"/>
  </g>
  <g stroke="#8a8a84" stroke-width="1">
    <line x1="360" y1="72" x2="360" y2="100"/>
    <line x1="360" y1="220" x2="360" y2="250"/>
  </g>
  <g font-family="Georgia, serif" font-size="14" fill="#c8c8c8" text-anchor="middle">
    <text x="185" y="53">find contacts</text>
    <text x="535" y="53">prepare: masses, softness</text>
    <text x="185" y="279">restitution: bounce hard hits</text>
    <text x="535" y="279">sleep, impact events</text>
    <text x="360" y="118" fill="#d9c591">repeated for each of 8 substeps</text>
    <text x="79" y="147">gravity,</text>
    <text x="79" y="165">damping,</text>
    <text x="79" y="183">air drag</text>
    <text x="191.4" y="156">warm</text>
    <text x="191.4" y="174">start</text>
    <text x="303.8" y="156">grab</text>
    <text x="303.8" y="174">spring</text>
    <text x="416.2" y="147">solve</text>
    <text x="416.2" y="165">contacts,</text>
    <text x="416.2" y="183">with bias</text>
    <text x="528.6" y="156">move</text>
    <text x="528.6" y="174">bodies</text>
    <text x="641" y="147">solve</text>
    <text x="641" y="165">contacts,</text>
    <text x="641" y="183">no bias</text>
    <text x="360" y="336" fill="#8a8a84">One fixed step, 60 times a second, in the order the solver runs it.</text>
  </g>
</svg>
